[project]
name = "aquenda-soa"
version = "1.0.0"
description = "Serviço FastAPI do Aquenda: vagas afirmativas e estabelecimentos do CNES"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
