name: python

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build do contrato da VM
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: pip install -r requirements.txt && alembic upgrade head
      - name: Migrações batem com os modelos
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic check
      - name: Testes (sem rede)
        run: pytest
